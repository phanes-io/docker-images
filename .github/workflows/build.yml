name: Build & Push Docker Images

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'  # Weekly Sunday 4am UTC

env:
  REGISTRY: ghcr.io
  ORG: phanes-io

jobs:
  rust-builder:
    name: rust-builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: rust-builder
          push: true
          tags: |
            ghcr.io/${{ env.ORG }}/rust-builder:bookworm
            ghcr.io/${{ env.ORG }}/rust-builder:latest
